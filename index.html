              "answerOptions": [

                {"text": "Các thiết bị chiếu sáng", "rationale": "Thiết bị chiếu sáng là tải chiếu sáng, là một phần của tải mạng điện sản xuất.", "isCorrect": false},

        const quizContainer = document.getElementById('quiz-container');
        const submitBtn = document.getElementById('submit-btn');
        const resultSummary = document.getElementById('result-summary');
        const scoreText = document.getElementById('score-text');
        const feedbackText = document.getElementById('feedback-text');
        
        // Lưu trữ lựa chọn của người dùng
        const userAnswers = {};
        const totalQuestions = quizData.questions.length;
        let answeredCount = 0;
        let isSubmitted = false;

        // Hàm cập nhật trạng thái nút Submit
        const updateSubmitButton = () => {
            answeredCount = Object.keys(userAnswers).length;
            submitBtn.textContent = `Xem Kết Quả (${answeredCount}/${totalQuestions})`;
            submitBtn.disabled = answeredCount < totalQuestions;
        };

        // Hàm xử lý khi người dùng chọn đáp án
        const handleAnswerClick = (qIndex, selectedOptionIndex) => {
            if (isSubmitted) return; // Không cho phép chọn lại sau khi nộp bài

            const questionElement = document.getElementById(`q-${qIndex}`);
            const options = questionElement.querySelectorAll('.answer-option');
            
            // Xóa trạng thái đã chọn trước đó (nếu có)
            options.forEach(opt => opt.classList.remove('selected'));

            // Đánh dấu lựa chọn mới
            const selectedOptionElement = options[selectedOptionIndex];
            selectedOptionElement.classList.add('selected');

            // Lưu trữ câu trả lời
            userAnswers[qIndex] = selectedOptionIndex;

            // Cập nhật nút Submit
            updateSubmitButton();
        };

        // Hàm render giao diện bài Quiz
        const renderQuiz = () => {
            quizData.questions.forEach((q, qIndex) => {
                const questionDiv = document.createElement('div');
                questionDiv.id = `q-${qIndex}`;
                questionDiv.className = 'mb-8 p-6 bg-white border border-gray-200 rounded-xl shadow-sm';
                
                // Câu hỏi
                const questionTitle = document.createElement('h3');
                questionTitle.className = 'text-xl font-semibold text-gray-800 mb-4';
                questionTitle.innerHTML = `Câu ${q.questionNumber}: ${q.question}`;
                questionDiv.appendChild(questionTitle);

                // Các tùy chọn đáp án
                q.answerOptions.forEach((option, oIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'answer-option p-3 mb-2 border border-gray-300 rounded-lg cursor-pointer transition duration-100 ease-in-out';
                    optionDiv.innerHTML = `<span class="font-medium mr-2 text-blue-600">${String.fromCharCode(65 + oIndex)}.</span> ${option.text}`;
                    
                    optionDiv.onclick = () => handleAnswerClick(qIndex, oIndex);

                    questionDiv.appendChild(optionDiv);
                });

                // Vùng giải thích (Rationale)
                const rationaleDiv = document.createElement('div');
                rationaleDiv.className = 'rationale mt-4 p-3 border-l-4 border-gray-400 bg-gray-50 rounded-r-lg text-sm text-gray-700';
                rationaleDiv.id = `rationale-${qIndex}`;
                questionDiv.appendChild(rationaleDiv);

                quizContainer.appendChild(questionDiv);
            });
        };

        // Hàm xử lý nộp bài và hiển thị kết quả
        const handleSubmit = () => {
            if (isSubmitted) return;
            isSubmitted = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đã Nộp Bài';
            submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            submitBtn.classList.add('bg-gray-500');

            let correctCount = 0;
            quizContainer.classList.add('show-results');

            quizData.questions.forEach((q, qIndex) => {
                const selectedOptionIndex = userAnswers[qIndex];
                const questionElement = document.getElementById(`q-${qIndex}`);
                const options = questionElement.querySelectorAll('.answer-option');
                const rationaleDiv = document.getElementById(`rationale-${qIndex}`);

                // Hiển thị phần giải thích
                rationaleDiv.style.display = 'block';
                rationaleDiv.innerHTML = '<strong>Giải thích:</strong> ';

                let isCorrect = false;
                
                q.answerOptions.forEach((option, oIndex) => {
                    const optionElement = options[oIndex];
                    
                    // 1. Đánh dấu đáp án đúng
                    if (option.isCorrect) {
                        optionElement.classList.add('is-correct');
                        rationaleDiv.innerHTML += option.rationale;
                        if (selectedOptionIndex === oIndex) {
                            isCorrect = true;
                        }
                    }

                    // 2. Đánh dấu đáp án mà người dùng đã chọn
                    if (selectedOptionIndex === oIndex) {
                        optionElement.classList.add('selected');
                        if (isCorrect) {
                            optionElement.classList.add('answered-correct');
                        } else {
                            optionElement.classList.add('answered-incorrect');
                        }
                    }
                });

                if (isCorrect) {
                    correctCount++;
                }

                // Vô hiệu hóa tất cả các sự kiện click
                options.forEach(opt => opt.onclick = null);
            });

            // Hiển thị tóm tắt kết quả
            resultSummary.classList.remove('hidden');
            scoreText.textContent = `Bạn đã trả lời đúng ${correctCount} trên tổng số ${totalQuestions} câu hỏi.`;
            
            if (correctCount === totalQuestions) {
                feedbackText.textContent = 'Xuất sắc! Bạn đã nắm vững kiến thức về Mạng điện Sản xuất Quy mô Nhỏ.';
                feedbackText.classList.add('text-green-600');
            } else if (correctCount >= totalQuestions * 0.75) {
                feedbackText.textContent = 'Rất tốt! Bạn cần xem lại một vài điểm nhỏ để đạt điểm tối đa.';
                feedbackText.classList.add('text-yellow-600');
            } else {
                feedbackText.textContent = 'Bạn nên xem lại toàn bộ bài giảng để củng cố kiến thức tốt hơn.';
                feedbackText.classList.add('text-red-600');
            }
        };

        // Gắn sự kiện cho nút Submit
        submitBtn.addEventListener('click', handleSubmit);

        // Khởi tạo bài Quiz khi tải trang
        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
